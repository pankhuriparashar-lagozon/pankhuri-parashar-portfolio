<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pankhuri Parashar | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F8;--card:#fff;--ink:#14182A;--mute:#586078;--line:#DADEE8;--pa:#8E4FC9;--pf:#2F6FDE;--cs:#0E9F9A;--bi:#D9921A;--db:#64748B;--ex:#3E9B63;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E111A;--card:#161A26;--ink:#ECEEF5;--mute:#9AA2B8;--line:#262B3A;--pa:#B58CF0;--pf:#6EA0FF;--cs:#3FD1CB;--bi:#F2B84B;--db:#94A3B8;--ex:#6FCB8F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E111A;--card:#161A26;--ink:#ECEEF5;--mute:#9AA2B8;--line:#262B3A;--pa:#B58CF0;--pf:#6EA0FF;--cs:#3FD1CB;--bi:#F2B84B;--db:#94A3B8;--ex:#6FCB8F;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 1rem);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.02em}
p,ul{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--pf);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.25rem}
.top{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0}
.top a{text-decoration:none;font-family:Sora,system-ui,sans-serif;font-weight:600}
.tgl{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.35rem .9rem;font-size:.9rem}
.hero{padding:3rem 0 2rem}
h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:700}
.lead{font-family:Sora,system-ui,sans-serif;font-weight:500;font-size:clamp(1.15rem,2.8vw,1.6rem);margin:1rem 0;max-width:30ch}
.intro{color:var(--mute);max-width:60ch}
.links{display:flex;gap:.7rem;margin-top:1.4rem;flex-wrap:wrap}
.links a{padding:.55rem 1.15rem;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;font-weight:500;transition:border-color .2s,transform .2s}
.links a:hover{border-color:var(--ink);transform:translateY(-2px)}
.demo{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;margin-top:2.2rem}
.demo .node{opacity:.25;animation:lit .5s forwards;animation-delay:calc(var(--d)*.55s + .4s)}
@keyframes lit{to{opacity:1}}
.node{position:relative;font-size:.88rem;line-height:1.35;padding:.45rem .75rem;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 13%,var(--card));max-width:15rem;text-align:left;transition:opacity .25s,box-shadow .25s,transform .25s}
.node+.node::before{content:"›";position:absolute;left:-.85rem;top:50%;transform:translateY(-50%);color:var(--mute)}
.pa{--c:var(--pa)}.pf{--c:var(--pf)}.cs{--c:var(--cs)}.bi{--c:var(--bi)}.db{--c:var(--db)}.ex{--c:var(--ex)}
h2{font-size:1.6rem;margin:3.2rem 0 1rem}
.legend{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--card);border-radius:8px;padding:.45rem .8rem;font-size:.92rem}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--c) 16%,var(--card));border-color:var(--c)}
.also{color:var(--mute);font-size:.9rem;margin-top:.7rem}
.list{display:grid;gap:.9rem}
.row{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:center;text-align:left;width:100%;padding:1.2rem 1.3rem;background:var(--card);border:1px solid var(--line);border-radius:14px;transition:transform .2s,border-color .2s,opacity .2s}
.row:hover{transform:translateY(-3px);border-color:var(--ink)}
.row h3{font-size:1.2rem}
.row p{color:var(--mute);font-size:.95rem;grid-column:1}
.dots{display:flex;gap:.35rem;grid-column:2;grid-row:1}
.dots i{width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.go{grid-column:2;grid-row:2;color:var(--mute);font-size:.9rem;justify-self:end}
.row.dim{opacity:.3}
.back{border:0;background:none;color:var(--mute);padding:.5rem 0;font-size:.95rem}
.ph{padding:1rem 0 .5rem}
.ph h1{font-size:clamp(2rem,5.5vw,3.4rem)}
.tools{color:var(--mute);margin-top:.6rem}
.page{display:grid;grid-template-columns:11rem 1fr;gap:3rem;margin-top:1.5rem}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem);align-self:start;display:grid;gap:.2rem;border-left:2px solid var(--line)}
.rail a{padding:.35rem .9rem;color:var(--mute);text-decoration:none;font-size:.92rem;margin-left:-2px;border-left:2px solid transparent}
.rail a.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.sec{padding-bottom:1rem}
.sec h2{margin-top:2.4rem;font-size:1.35rem}
.sec:first-child h2{margin-top:0}
.sec p,.sec li{max-width:64ch}
.sec ul{padding-left:1.15rem;display:grid;gap:.5rem}
.sec li::marker{color:var(--mute)}
.cap{font-weight:600;font-size:.9rem;margin:1.2rem 0 .5rem}
.chain{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem}
.chain .node{cursor:pointer}
.node.act{box-shadow:0 0 0 2px var(--c);transform:translateY(-2px)}
.ctl{display:flex;align-items:center;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.ctl button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.35rem .9rem}
.ctl span{color:var(--mute);font-size:.9rem}
.end{border-left:4px solid var(--ink);padding-left:1rem}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin:3rem 0 1rem}
.nav button{padding:1rem;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left}
.nav small{display:block;color:var(--mute)}
.nav button:last-child{text-align:right}
.exp{display:grid;gap:.6rem}
.exp span{color:var(--mute)}
footer{margin:4rem 0 2rem;color:var(--mute);font-size:.9rem}
@media (max-width:760px){.page{grid-template-columns:1fr}.rail{position:static;display:flex;overflow-x:auto;border:0;border-bottom:2px solid var(--line)}.rail a{white-space:nowrap;margin:0;border-left:0;border-bottom:2px solid transparent;margin-bottom:-2px}.rail a.on{border-bottom-color:var(--ink)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.demo .node{opacity:1}html{scroll-behavior:auto}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
const T={pa:["Power Apps"],pf:["Power Automate"],cs:["Copilot Studio"],bi:["Power BI"],db:["Data and logic"],ex:["Integrations"]};
const P=[
{id:"sales",n:"Inside Sales Applications",s:"Account assignment, call logging and daily reports for a sales team",t:"pa pf db bi",tx:"Power Apps, Power Automate, SharePoint, Power BI",
about:"A Canvas App with a Power Automate backbone that moves a sales team off scattered Excel sheets. Reps pick and work their own accounts, managers see everything, and a daily status report is built from what reps actually log. About 12 users work on 25,000 to 30,000 records.",
mine:["Designed the UI, screen navigation and overall workflow","Built the bulk-upload flow that creates new records, updates existing ones and emails the manager the counts","Built the nightly flow that compiles each rep's daily status report","Created the Power BI report for daily and monthly performance against target","Worked in a team of two with a senior developer"],
f:[["Getting data in",[["db","Excel sheet from data mining"],["pf","Bulk-upload flow: update existing rows, create new ones"],["db","SharePoint list"],["pf","Email to manager with new and updated counts"]]],["Daily use",[["pa","Rep filters and self-assigns an account"],["db","Permissions list checks rep or manager"],["pa","Only the assignee logs calls and remarks"],["db","Every change and reassignment logged"]]],["Every night",[["db","Logged activity"],["pf","Scheduled flow builds each rep's report"],["pf","Report emailed to the manager"],["bi","Daily and monthly performance against target"]]]],
prob:["Accounts were assigned by hand and tracked in separate Excel sheets","Reps re-reported the same accounts in later weeks to reach the 50-calls-a-day target","Two reps could call the same client without knowing","Managers could not tell real activity from repeated reporting"],
end:"Every account has one owner, every action is logged, and reports build themselves. Duplicate calls stopped, managers can trace a positive remark that never became a sale back to the log, and reps spend their time on calls instead of reports."},
{id:"skills",n:"Skill Matrix",s:"Skills, certifications and expiry reminders for a service company",t:"pa pf db",tx:"Power Apps, Power Automate, SharePoint",
about:"A Canvas App where employees maintain their own skills and certifications, and management searches them when a client asks for a specific profile. A scheduled flow chases certification expiries.",
mine:["Built the whole project alone: UI, data model, flows and search","Designed three SharePoint lists linked by employee ID, with screens for skills, certifications and profile","Built the admin gallery with text search and skill and certification dropdowns, using delegable StartsWith","Built the 9 AM expiry flow with 30, 7 and 1 day branches and a flag that prevents repeat emails"],
f:[["Employees and admins",[["pa","Employee adds skills and certifications, with a PDF as proof"],["db","Three SharePoint lists linked by employee ID"],["pa","Admin gallery with skill and certification dropdowns"]]],["Every morning at 9",[["pf","Scheduled flow checks expiry dates"],["pf","Three branches: 30 days, 7 days, 1 day before"],["pf","Reminder to the employee, HR and management in CC"],["db","Flag set so a reminder is never sent twice"]]]],
prob:["Skills and certifications sat in one Excel sheet kept by one person","Expiring certifications were easy for HR and management to miss","Finding someone with the right skills and certifications meant filtering a large sheet by hand"],
end:"Employees own their records, expiries are chased automatically, and management finds the right candidate in a couple of clicks."},
{id:"ewms",n:"Early Warning Management System",s:"A weekly project health check that escalates problems early",t:"pa pf db",tx:"Power Apps, Power Automate, SharePoint",
about:"A weekly project health check. Teams rate six areas, and anything marked Low alerts management until it is resolved.",
mine:["Built the project alone, end to end","Designed the weekly form: Process, Associates, Non-mitigated risks, Metrics, Customer and Support services, each rated High, Medium or Low","Built the Friday reminder, the after-hours follow-up and the weekly escalation emails"],
f:[["Every week",[["db","Project registered in the app"],["pf","Friday reminder with the project ID"],["pf","Second reminder after hours if still unfilled"],["pa","Team rates six areas High, Medium or Low"],["db","Stored in SharePoint"]]],["When something is Low",[["pa","Any area marked Low (red)"],["pf","Email to management and the project manager"],["pf","Reminders repeat weekly until resolved"]]]],
prob:["Many projects ran at once, so health was hard to track","Gaps and blockers surfaced late","Leads had no common format to compare projects"],
end:"Management gets a weekly, comparable view of every project and sees red flags as soon as they are raised."},
{id:"ops",n:"Maintenance and Operations Management",s:"An integration and operations app between SAP and a field-tracking system",t:"db ex",tx:"UnifyApps, SAP REST APIs, PostgreSQL, GraphQL",
about:"An operations app on UnifyApps for a maintenance team spanning thousands of stores. It sits between SAP and a field-tracking system, tracks assets and service requests, and controls attendance by location. Client details are left out on purpose.",
mine:["Part of a team of six to seven, focused on workflow design and integrations","Integrated SAP REST APIs: purchase requests, PO creation, approval and receiving, inbound and outbound delivery, request tracking and inventory adjustment","Integrated PostgreSQL queries for CRUD and Unolo GraphQL APIs for attendance and coordinates","Built a temporary Excel upload workflow while the SAP upload APIs were not ready"],
f:[["Integration layer, both directions",[["ex","SAP"],["ex","The app in the middle stores and forwards data"],["ex","Unolo"]]],["Attendance",[["ex","Unolo GraphQL returns employee and store coordinates"],["db","Distance calculated in meters"],["db","Within 100 m: clock in or out is allowed"]]],["Bulk upload (temporary)",[["db","Excel file uploaded in the app"],["db","Headers identify PO, purchase request or stock transfer"],["db","Blank and invalid data checked, read retried on failure"],["ex","SAP uploader creates the document"]]]],
prob:["Asset data lived in email and Excel, so lost, stolen or broken items could not be traced","SAP and the tracking system exchanged data directly, with no control point","Staff could mark attendance from anywhere"],
end:"One record of assets per store, controlled data exchange between systems, and clock-in only within 100 meters of the store."},
{id:"dash",n:"Public Sector Dashboard",s:"The social media engagement section of a management dashboard",t:"bi db",tx:"Power BI",
about:"A management dashboard for a fundraising organization covering funds raised, distribution, returns and donor retention. It was a team project; my part was the social media engagement section.",
mine:["Designed the social media visuals on a live data connection that was already set up","Showed engagement by platform, visitors, likes and shares, and follower growth over time","Arranged the visuals into the management dashboard"],
f:[["Social media section",[["db","Live data, connection already set up"],["bi","Engagement by platform"],["bi","Visitors, likes and shares"],["bi","Follower growth over time"],["bi","Arranged on the management dashboard"]]]],
prob:["Management needed one view of how social media was performing","They needed to see which platform engaged most and how followers grew"],
end:"Management can judge each platform at a glance and see growth over time."},
{id:"jira",n:"Jira Ticket Analytics Agent",s:"A Copilot Studio agent that answers questions about Jira tickets",t:"cs db ex",tx:"Copilot Studio, SQL Server, Gmail connector",
about:"A Copilot Studio agent that answers plain-language questions about Jira tickets, sprint risk and team workload from SQL Server data, then offers visuals and can email a summary. Example: \"Which five issues are at risk of missing this sprint, and why?\"",
mine:["Wrote the agent's instructions and behavior","Connected SQL Server through the knowledge source and SQL connector","Added a visual skill that offers a chart when it would help","Added an email skill: it asks for a recipient, then the Gmail connector sends a summary the LLM writes"],
f:[["Asking",[["db","Jira data in SQL Server, loaded by a pipeline"],["cs","Manager asks a question in chat"],["cs","Agent queries SQL Server through the SQL connector"],["cs","Answer with tables and comparisons"]]],["Skills I added",[["cs","Offers a visual when it would help, builds it on a yes"],["cs","Asks for a recipient when a report is requested"],["ex","Gmail connector sends the summary the LLM writes"]]]],
prob:["Judging sprint risk and team workload meant digging through ticket data","Managers needed comparisons and summaries without writing queries"],
end:"A manager can ask which issues are at risk or who is overloaded and get an answer, a chart and an emailed summary in one conversation."}];
const app=document.getElementById("app");let timer,io,cur="";
const li=a=>a.map(x=>`<li>${x}</li>`).join("");
const node=(n,i)=>`<button class="node ${n[0]}" data-i="${i}">${n[1]}</button>`;
const theme=`<button class="tgl" id="tg">Light or dark</button>`;
document.addEventListener("click",e=>{if(e.target.id==="tg"){const r=document.documentElement,d=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";r.dataset.theme=d?"light":"dark"}});
function home(){
app.innerHTML=`<div class="top"><a href="#/">Pankhuri Parashar</a>${theme}</div>
<section class="hero"><h1>Pankhuri Parashar</h1><p class="lead">Power Platform developer who turns spreadsheet processes into apps, flows and agents.</p>
<p class="intro">I have 2.5 years of experience building Canvas Apps, Power Automate flows, Power BI dashboards and Copilot Studio agents on SharePoint, SQL Server, PostgreSQL and REST APIs. I like work where an app, an automation and a little AI come together to remove manual effort. Next, I want to go deeper into Copilot Studio, Power Apps and Power Automate.</p>
<div class="links"><a href="https://www.linkedin.com/in/pankhuri-parashar-1821b5229" target="_blank" rel="noopener">LinkedIn</a><a href="https://github.com/Pankhuri-Parashar22" target="_blank" rel="noopener">GitHub</a></div>
<div class="demo">${[["db","Excel"],["pf","Flow"],["db","SharePoint"],["pa","App"],["bi","Report"]].map((n,i)=>`<span class="node ${n[0]}" style="--d:${i}">${n[1]}</span>`).join("")}</div></section>
<h2>Skills</h2><div class="legend">${Object.entries(T).map(([k,v])=>`<button class="chip ${k}" data-k="${k}" aria-pressed="false">${v[0]}</button>`).join("")}</div>
<p class="also">Select a skill to filter the projects below. Also: Python.</p>
<h2>Projects</h2><div class="list">${P.map(p=>`<button class="row" data-id="${p.id}" data-t="${p.t}"><h3>${p.n}</h3><span class="dots">${p.t.split(" ").map(k=>`<i class="${k}"></i>`).join("")}</span><p>${p.s}</p><span class="go">Open project</span></button>`).join("")}</div>
<h2>Experience and education</h2><div class="exp"><p><b>Power Platform Developer, Lagozon Technologies, New Delhi</b><br><span>April 2024 to present</span></p><p>Gather requirements, build Canvas Apps and flows, join testing and UAT, and support apps in production.</p><p><b>B.Tech Computer Science</b>, Sant Longowal Institute of Engineering and Technology <span>2021 to 2024</span></p><p><b>Diploma in Computer Science</b>, Sant Longowal Institute of Engineering and Technology <span>2018 to 2021</span></p></div>
<footer>Client names and data are left out of every project on this page.</footer>`;
cur="";
app.querySelector(".legend").onclick=e=>{const b=e.target.closest("button");if(!b)return;cur=cur===b.dataset.k?"":b.dataset.k;app.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===cur));app.querySelectorAll(".row").forEach(r=>r.classList.toggle("dim",!!cur&&!r.dataset.t.split(" ").includes(cur)))};
app.querySelector(".list").onclick=e=>{const r=e.target.closest(".row");if(r)location.hash="#/p/"+r.dataset.id}}
function proj(i){
const p=P[i],all=p.f.flatMap(g=>g[1]);let k=0,pos=-1;
const prev=P[i-1],next=P[i+1];
app.innerHTML=`<div class="top"><a href="#/">Pankhuri Parashar</a>${theme}</div>
<button class="back" onclick="location.hash='#/'">Back to all projects</button>
<div class="ph"><h1>${p.n}</h1><p class="tools">${p.tx}</p></div>
<div class="page"><nav class="rail"><a href="#s-about">About</a><a href="#s-mine">My contribution</a><a href="#s-flow">Workflow</a><a href="#s-prob">Problem solved</a><a href="#s-end">Conclusion</a></nav>
<div><section class="sec" id="s-about"><h2>About the project</h2><p>${p.about}</p></section>
<section class="sec" id="s-mine"><h2>My contribution</h2><ul>${li(p.mine)}</ul></section>
<section class="sec" id="s-flow"><h2>Workflow</h2><p>Follow the app from start to end. Select a step, or press play.</p>
${p.f.map(g=>`<p class="cap">${g[0]}</p><div class="chain">${g[1].map(n=>node(n,k++)).join("")}</div>`).join("")}
<div class="ctl"><button id="pv">Previous</button><button id="pl">Play</button><button id="nx">Next</button><span id="st">Step 1 of ${all.length}</span></div></section>
<section class="sec" id="s-prob"><h2>What problem it solved</h2><ul>${li(p.prob)}</ul></section>
<section class="sec" id="s-end"><h2>Conclusion</h2><p class="end">${p.end}</p></section>
<div class="nav">${prev?`<button data-go="${prev.id}"><small>Previous project</small>${prev.n}</button>`:"<span></span>"}${next?`<button data-go="${next.id}"><small>Next project</small>${next.n}</button>`:"<span></span>"}</div></div></div>`;
const ns=[...app.querySelectorAll(".chain .node")],st=app.querySelector("#st"),pl=app.querySelector("#pl");
const show=n=>{pos=(n+ns.length)%ns.length;ns.forEach((x,j)=>x.classList.toggle("act",j===pos));st.textContent=`Step ${pos+1} of ${ns.length}`};
const stop=()=>{clearInterval(timer);timer=0;pl.textContent="Play"};
app.querySelector("#s-flow").onclick=e=>{const n=e.target.closest(".node");if(n){stop();show(+n.dataset.i)}else if(e.target.id==="pv"){stop();show(pos-1)}else if(e.target.id==="nx"){stop();show(pos+1)}else if(e.target.id==="pl"){if(timer)return stop();pl.textContent="Pause";show(pos+1);timer=setInterval(()=>show(pos+1),1400)}};
app.querySelector(".nav").onclick=e=>{const b=e.target.closest("[data-go]");if(b)location.hash="#/p/"+b.dataset.go};
show(0);
const links=[...app.querySelectorAll(".rail a")];
io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)links.forEach(l=>l.classList.toggle("on",l.getAttribute("href")==="#"+x.target.id))}),{rootMargin:"-30% 0px -60% 0px"});
app.querySelectorAll(".sec").forEach(s=>io.observe(s));
app.querySelectorAll(".rail a").forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.getAttribute("href").slice(1)).scrollIntoView()})}
function route(){clearInterval(timer);io&&io.disconnect();const m=location.hash.match(/^#\/p\/(\w+)/),i=m?P.findIndex(p=>p.id===m[1]):-1;i>=0?proj(i):home();window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
